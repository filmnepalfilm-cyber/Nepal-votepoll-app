          id: 'custom_' + Date.now(),
          name: candName.trim(),
          party: candParty.trim(),
          province: candProvince,
          district: candDistrict,
          photo: candPhoto || null,
          symbol: '👤',
          isCustom: true

        setCandidates([newCandidate, ...candidates]);

        setCandParty('');
        setCandPhoto(null);

          return;
        }

          return;
        }

          id: Date.now(),
          email: email.trim().toLowerCase(),
          province,
          district,
          localBody,
          partyId: selectedParty,
          timestamp: new Date().toLocaleString('ne-NP')

                    >
                      <option value="">-- प्रदेश --</option>
                      {Object.keys(NEPAL_DATA).map(p => (
                        <option key={p} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-2">४. जिल्ला</label>
                    <select
                      value={candDistrict}
                      disabled={!candProvince}
                      onChange={(e) => setCandDistrict(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20 disabled:bg-slate-100"
                    >
                      <option value="">-- जिल्ला --</option>
                      {candProvince && Object.keys(NEPAL_DATA[candProvince] || {}).map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-700 font-bold mb-2">५. उम्मेदवारको फोटो अपलोड (Optional)</label>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleImageUpload}
                    className="w-full px-4 py-2 border border-pink-200 rounded-xl bg-pink-50/20 text-slate-600"
                  />
                  {candPhoto && (
                    <div className="mt-3 flex items-center space-x-3">
                      <img src={candPhoto} alt="Preview" className="w-16 h-16 rounded-full object-cover border-2 border-pink-500" />
                      <span className="text-xs text-emerald-600 font-bold">फोटो तयार भयो!</span>
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold text-lg rounded-xl hover:from-emerald-700 hover:to-teal-700 shadow-lg shadow-emerald-100 transition-all"
                >
                  उम्मेदवार दर्ता गर्नुहोस् (Register Candidate)
                </button>
              </form>
            </div>
          )}

          {/* Tab 3: Live Results */}
          {activeTab === 'results' && (
            <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-pink-100">
              <div className="flex justify-between items-center mb-8 border-b pb-4">
                <div>
                  <h2 className="text-2xl font-bold text-slate-800">लाइभ जनमत नतिजा (Live Results)</h2>
                  <p className="text-slate-500">कुल खसेको मत: <span className="font-extrabold text-pink-600">{totalVotes}</span></p>
                </div>
              </div>

              {totalVotes === 0 ? (
                <div className="text-center py-12 text-slate-400">
                  अहिले सम्म कुनै पनि मत खसेको छैन।
                </div>
              ) : (
                <div className="space-y-5">
                  {candidates.map(cand => {
                    const count = getCandidateCount(cand.id);
                    const percent = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : 0;
                    return (
                      <div key={cand.id} className="space-y-1 bg-pink-50/30 p-3 rounded-xl border border-pink-100">
                        <div className="flex justify-between items-center font-bold text-sm">
                          <span className="flex items-center space-x-3">
                            {cand.photo ? (
                              <img src={cand.photo} className="w-8 h-8 rounded-full object-cover" />
                            ) : (
                              <span>{cand.symbol}</span>
                            )}
                            <span>{cand.name} ({cand.party})</span>
                          </span>
                          <span className="text-pink-700">{count} मत ({percent}%)</span>
                        </div>
                        <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                          <div
                            className="bg-pink-600 h-full transition-all duration-500"
                            style={{ width: `${percent}%` }}
                          ></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
